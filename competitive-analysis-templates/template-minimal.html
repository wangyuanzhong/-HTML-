<!DOCTYPE html>
<!--
  template-minimal.html — 简约大气（留白 + 衬线标题）
  内容填充方式同 template-tech.html。
-->
<html
  lang="zh-CN"
  data-deck-theme="minimal"
  data-matrix-objective-xlsx="data/matrix-objective.xlsx"
  data-matrix-subjective-xlsx="data/matrix-subjective.xlsx"
>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>消费类导入产品横向对比 · 简约模板</title>
  <link rel="stylesheet" href="themes/layout.css" />
  <link rel="stylesheet" href="themes/theme-minimal.css" />
</head>
<body class="deck">
  <a class="deck-skip" href="#deck-stage">跳到内容</a>

  <nav id="slide-nav" aria-label="幻灯导航">
    <button type="button" data-slide-dot="0" aria-label="封面"></button>
    <button type="button" data-slide-dot="1" aria-label="概述"></button>
    <button type="button" data-slide-dot="2" aria-label="客观矩阵"></button>
    <button type="button" data-slide-dot="3" aria-label="主观矩阵"></button>
    <button type="button" data-slide-dot="4" aria-label="结束"></button>
  </nav>

  <main id="deck-stage" class="deck-stage" aria-live="polite" tabindex="-1">
  <section data-slide data-slide-index="0" aria-label="封面">
    <div class="slide-inner deck-edit-slide-inner">
      <div class="deck-edit-bar" id="deck-edit-bar">
        <button type="button" class="btn btn--ghost deck-edit-bar__btn" id="deck-edit-enter">进入编辑模式</button>
        <button type="button" class="btn btn--ghost deck-edit-bar__btn" id="deck-edit-save" disabled>保存</button>
        <button type="button" class="btn btn--ghost deck-edit-bar__btn" id="deck-edit-exit" disabled>退出</button>
        <button type="button" class="btn btn--ghost deck-edit-bar__btn" id="deck-portable-export">导出 JSON</button>
        <button type="button" class="btn btn--ghost deck-edit-bar__btn" id="deck-portable-import-trigger">导入 JSON</button>
        <input type="file" id="deck-portable-import-file" accept="application/json,.json,text/json" hidden aria-hidden="true" />
      </div>
      <p class="cover-eyebrow" id="cover-eyebrow"></p>
      <h1 class="cover-title" id="cover-title"></h1>
      <div class="cover-subtitle" id="cover-subtitle"></div>
      <div class="slide-actions">
        <button type="button" class="btn" data-slide-go="1">概述</button>
      </div>
    </div>
  </section>

  <section data-slide data-slide-index="1" aria-labelledby="overview-title" hidden>
    <div class="slide-inner">
      <h2 id="overview-title" hidden></h2>
      <div id="overview-sections"></div>
      <div class="slide-actions">
        <button type="button" class="btn btn--ghost" data-slide-go="0">返回</button>
        <button type="button" class="btn" data-slide-go="2">客观矩阵</button>
      </div>
    </div>
  </section>

  <section data-slide data-slide-index="2" aria-label="竞品对比矩阵（客观）" hidden>
    <div class="slide-inner">
      <h2 class="slide-matrix-title">竞品对比矩阵（客观）</h2>

      <div id="filter-deck" class="matrix-toolbar">
        <div>
          <h3>参数行</h3>
          <div id="filter-rows" class="filter-group"></div>
        </div>
        <div>
          <h3>产品列</h3>
          <div id="filter-cols" class="filter-group"></div>
        </div>
        <div class="matrix-structure-tools" aria-label="编辑表格结构">
          <span class="matrix-structure-tools__hint">结构</span>
          <button type="button" class="btn btn--ghost" data-matrix-structure="obj" data-matrix-action="add-row">+行</button>
          <button type="button" class="btn btn--ghost" data-matrix-structure="obj" data-matrix-action="remove-row">−行</button>
          <button type="button" class="btn btn--ghost" data-matrix-structure="obj" data-matrix-action="add-col">+列</button>
          <button type="button" class="btn btn--ghost" data-matrix-structure="obj" data-matrix-action="remove-col">−列</button>
          <button type="button" class="btn btn--ghost" data-matrix-structure="obj" data-matrix-action="col-move-left" title="编辑模式下先点一下列表头（会记住该列），再点此左移一列">列←</button>
          <button type="button" class="btn btn--ghost" data-matrix-structure="obj" data-matrix-action="col-move-right" title="编辑模式下先点一下列表头（会记住该列），再点此右移一列">列→</button>
          <button type="button" class="btn btn--ghost" data-matrix-structure="obj" data-matrix-action="row-move-up" title="编辑模式下先点一下左侧参数行标题（会记住该行），再点此上移一行">行↑</button>
          <button type="button" class="btn btn--ghost" data-matrix-structure="obj" data-matrix-action="row-move-down" title="编辑模式下先点一下左侧参数行标题（会记住该行），再点此下移一行">行↓</button>
        </div>
      </div>

      <div class="table-scroll">
        <table id="comparison-table">
          <thead id="matrix-thead"></thead>
          <tbody id="matrix-tbody"></tbody>
        </table>
      </div>

      <div class="matrix-slide-footer">
        <div class="slide-actions">
          <button type="button" class="btn btn--ghost" data-slide-go="1">返回概述</button>
          <button type="button" class="btn" data-slide-go="3">主观矩阵</button>
        </div>
        <div class="compare-fab-anchor" id="compare-fab-anchor-objective" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <section data-slide data-slide-index="3" aria-label="竞品对比矩阵（主观）" hidden>
    <div class="slide-inner">
      <h2 class="slide-matrix-title">竞品对比矩阵（主观）</h2>

      <div id="filter-deck-sub" class="matrix-toolbar">
        <div>
          <h3>参数行</h3>
          <div id="filter-rows-sub" class="filter-group"></div>
        </div>
        <div>
          <h3>产品列</h3>
          <div id="filter-cols-sub" class="filter-group"></div>
        </div>
        <div class="matrix-structure-tools" aria-label="编辑表格结构">
          <span class="matrix-structure-tools__hint">结构</span>
          <button type="button" class="btn btn--ghost" data-matrix-structure="sub" data-matrix-action="add-row">+行</button>
          <button type="button" class="btn btn--ghost" data-matrix-structure="sub" data-matrix-action="remove-row">−行</button>
          <button type="button" class="btn btn--ghost" data-matrix-structure="sub" data-matrix-action="add-col">+列</button>
          <button type="button" class="btn btn--ghost" data-matrix-structure="sub" data-matrix-action="remove-col">−列</button>
          <button type="button" class="btn btn--ghost" data-matrix-structure="sub" data-matrix-action="col-move-left" title="编辑模式下先点一下列表头（会记住该列），再点此左移一列">列←</button>
          <button type="button" class="btn btn--ghost" data-matrix-structure="sub" data-matrix-action="col-move-right" title="编辑模式下先点一下列表头（会记住该列），再点此右移一列">列→</button>
          <button type="button" class="btn btn--ghost" data-matrix-structure="sub" data-matrix-action="row-move-up" title="编辑模式下先点一下左侧参数行标题（会记住该行），再点此上移一行">行↑</button>
          <button type="button" class="btn btn--ghost" data-matrix-structure="sub" data-matrix-action="row-move-down" title="编辑模式下先点一下左侧参数行标题（会记住该行），再点此下移一行">行↓</button>
        </div>
      </div>

      <div class="table-scroll">
        <table id="comparison-table-sub">
          <thead id="matrix-thead-sub"></thead>
          <tbody id="matrix-tbody-sub"></tbody>
        </table>
      </div>

      <div class="matrix-slide-footer">
        <div class="slide-actions">
          <button type="button" class="btn btn--ghost" data-slide-go="2">客观矩阵</button>
          <button type="button" class="btn" data-slide-go="4">结束</button>
        </div>
        <div class="compare-fab-anchor" id="compare-fab-anchor-subjective" aria-hidden="true"></div>
      </div>
    </div>
  </section>

  <section data-slide data-slide-index="4" aria-label="结束" hidden>
    <div class="slide-inner">
      <p class="cover-eyebrow" id="ending-eyebrow"></p>
      <h1 class="cover-title" id="ending-title"></h1>
      <div id="ending-body" class="ending-body"></div>
      <div class="slide-actions">
        <button type="button" class="btn btn--ghost" data-slide-go="3">主观矩阵</button>
        <button type="button" class="btn btn--ghost" data-slide-go="0">封面</button>
      </div>
    </div>
  </section>
  </main>

  <div id="compare-fab-park" hidden aria-hidden="true">
    <div id="compare-fab-host" class="compare-fab-stack" aria-label="详细对比" hidden>
      <div class="compare-fab__row">
        <button type="button" class="compare-fab__cancel" id="compare-fab-cancel" hidden aria-label="退出对比模式">✕</button>
        <button type="button" class="btn compare-fab__main" id="compare-launch-btn" aria-expanded="false">详细对比</button>
      </div>
    </div>
  </div>

  <div id="cell-modal" hidden aria-hidden="true">
    <div id="modal-backdrop"></div>
    <div class="modal-sheet-wrap">
      <div id="modal-shell" role="dialog" aria-modal="true" aria-labelledby="modal-meta" tabindex="-1">
        <header>
          <p id="modal-meta"></p>
          <div class="modal-header-end">
            <button type="button" class="modal-photo-add" id="modal-photo-trigger" aria-label="添加图片">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v14H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-4.86 8.86l-3 3.87L9 13.14 6 17h12l-3.86-5.14z"/></svg>
            </button>
            <input id="modal-image-input" type="file" accept="image/*" multiple hidden />
            <button type="button" id="modal-close" aria-label="关闭">×</button>
          </div>
        </header>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>

  <div id="compare-report-modal" hidden aria-hidden="true">
    <div id="compare-report-backdrop"></div>
    <div class="modal-sheet-wrap">
      <div id="compare-report-shell" role="dialog" aria-modal="true" aria-labelledby="compare-report-meta" tabindex="-1">
        <header>
          <p id="compare-report-meta">对比报告</p>
          <button type="button" id="compare-report-close" aria-label="关闭">×</button>
        </header>
        <div id="compare-report-body-inner"></div>
      </div>
    </div>
  </div>

  <script src="assets/sheetjs.full.min.js"></script>
  <script src="assets/matrix-core.js"></script>
  <script src="assets/deck-stage-fit.js"></script>
</body>
</html>
