<!DOCTYPE html>
<!--
  template-minimal.html — 简约大气（留白 + 衬线标题）
  内容填充方式同 template-tech.html。结构由 matrix-core.js 动态渲染（pages 数组驱动）。
-->
<html
  lang="zh-CN"
  data-deck-theme="minimal"
  data-matrix-objective-xlsx="data/matrix-objective.xlsx"
  data-matrix-subjective-xlsx="data/matrix-subjective.xlsx"
>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>总标题 · 简约模板</title>
  <script>
    (function () {
      var version = "20260523f";
      window.__DECK_APP_VERSION__ = version;
      try {
        var last = localStorage.getItem("matrix-deck-app-version");
        if (last === version) return;
        localStorage.setItem("matrix-deck-app-version", version);
        var tasks = [];
        if (window.caches && caches.keys) {
          tasks.push(caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) { return caches.delete(key); }));
          }));
        }
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
          tasks.push(navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (reg) { return reg.unregister(); }));
          }));
        }
        Promise.all(tasks).catch(function () {}).then(function () {
          var url = new URL(window.location.href);
          if (url.searchParams.get("_deckv") !== version) {
            url.searchParams.set("_deckv", version);
            window.location.replace(url.toString());
          }
        });
      } catch (err) {}
    })();
  </script>
  <link rel="stylesheet" href="themes/layout.css?v=20260523f" />
  <link rel="stylesheet" href="themes/theme-minimal.css?v=20260523f" />
</head>
<body class="deck">
  <a class="deck-skip" href="#deck-stage">跳到内容</a>

  <div class="deck-chrome-shell" id="deck-chrome-shell" aria-label="文稿与模板">
    <button
      type="button"
      class="deck-chrome-hover-target"
      id="deck-chrome-hover-target"
      aria-label="展开文稿与数据工具栏（模板、导入导出 JSON）"
      title="文稿工具"
    ></button>
    <div class="deck-chrome-inner">
      <div
        class="deck-edit-bar deck-edit-bar--chrome"
        id="deck-edit-bar"
        aria-label="文稿与数据（非讲演内容）"
      >
        <label class="deck-template-select-wrap" for="deck-template-select">
          <span class="deck-template-select__label">模板</span>
          <select
            id="deck-template-select"
            class="deck-template-select"
            autocomplete="off"
            aria-label="选择视觉模板（打开对应 HTML 文件）"
          >
            <option value="template-tech.html">科技霓虹</option>
            <option value="template-macaron.html">马卡龙</option>
            <option value="template-minimal.html" selected>极简衬线</option>
          </select>
        </label>
        <span class="deck-version" aria-label="版本">V 0.2</span>
        <button type="button" class="btn btn--ghost deck-edit-bar__btn" id="deck-edit-enter">进入编辑模式</button>
        <button type="button" class="btn btn--ghost deck-edit-bar__btn" id="deck-edit-save" disabled>保存</button>
        <button type="button" class="btn btn--ghost deck-edit-bar__btn" id="deck-edit-exit" disabled>退出</button>
        <button type="button" class="btn btn--ghost deck-edit-bar__btn" id="deck-portable-export">导出 JSON</button>
        <button type="button" class="btn btn--ghost deck-edit-bar__btn" id="deck-portable-import-trigger">导入 JSON</button>
        <input type="file" id="deck-portable-import-file" accept="application/json,.json,text/json" hidden aria-hidden="true" />
        <span class="deck-edit-bar__divider" aria-hidden="true"></span>
        <span class="deck-edit-bar__group" id="deck-page-tools" data-edit-only="1">
          <span class="deck-edit-bar__hint">当前页之后插入</span>
          <button type="button" class="btn btn--ghost deck-edit-bar__btn" data-page-add="cover">+ 封面</button>
          <button type="button" class="btn btn--ghost deck-edit-bar__btn" data-page-add="overview">+ 概述</button>
          <button type="button" class="btn btn--ghost deck-edit-bar__btn" data-page-add="table">+ 表格</button>
          <button type="button" class="btn btn--ghost deck-edit-bar__btn" data-page-add="mindmap">+ 思维导图</button>
          <button type="button" class="btn btn--ghost deck-edit-bar__btn" data-page-add="ending">+ 结束页</button>
          <button type="button" class="btn btn--ghost deck-edit-bar__btn" data-page-action="duplicate" title="复制当前页">⎘ 复制本页</button>
          <button type="button" class="btn btn--ghost deck-edit-bar__btn" data-page-action="delete" title="删除当前页">✕ 删除本页</button>
        </span>
      </div>
    </div>
  </div>

  <nav id="slide-nav" aria-label="幻灯导航"></nav>

  <main id="deck-stage" class="deck-stage" aria-live="polite" tabindex="-1"></main>

  <div id="compare-fab-park" hidden aria-hidden="true">
    <div id="compare-fab-host" class="compare-fab-stack" aria-label="详细对比" hidden>
      <div class="compare-fab__row">
        <button type="button" class="compare-fab__cancel" id="compare-fab-cancel" hidden aria-label="退出对比模式">✕</button>
        <button type="button" class="btn compare-fab__main" id="compare-launch-btn" aria-expanded="false">详细对比</button>
      </div>
    </div>
  </div>

  <div id="cell-modal" hidden aria-hidden="true">
    <div id="modal-backdrop"></div>
    <div class="modal-sheet-wrap">
      <div id="modal-shell" role="dialog" aria-modal="true" aria-labelledby="modal-meta" tabindex="-1">
        <header>
          <p id="modal-meta"></p>
          <div class="modal-header-end">
            <button type="button" class="modal-photo-add" id="modal-photo-trigger" aria-label="添加图片">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 5v14H5V5h14m0-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-4.86 8.86l-3 3.87L9 13.14 6 17h12l-3.86-5.14z"/></svg>
            </button>
            <input id="modal-image-input" type="file" accept="image/*" multiple hidden />
            <button type="button" id="modal-close" aria-label="关闭">×</button>
          </div>
        </header>
        <div id="modal-body"></div>
      </div>
    </div>
  </div>

  <div id="compare-report-modal" hidden aria-hidden="true">
    <div id="compare-report-backdrop"></div>
    <div class="modal-sheet-wrap">
      <div id="compare-report-shell" role="dialog" aria-modal="true" aria-labelledby="compare-report-meta" tabindex="-1">
        <header>
          <p id="compare-report-meta">对比报告</p>
          <button type="button" id="compare-report-close" aria-label="关闭">×</button>
        </header>
        <div id="compare-report-body-inner"></div>
      </div>
    </div>
  </div>

  <script id="deck-data" type="application/json">
{
  "theme": "minimal",
  "cover": {
    "eyebrow": "模板标签",
    "title": "总标题<br><span style=\"opacity:.65;font-size:.48em;letter-spacing:.12em;text-transform:uppercase;display:block;margin-top:.35em;\">副标题</span>",
    "subtitle": "<p>这里填写封面说明。</p>"
  },
  "overview": {
    "title": "概述标题",
    "sections": [
      { "heading": "小标题一", "bodyHtml": "<p>这里填写概述内容。</p>" },
      { "heading": "小标题二", "bodyHtml": "<p>这里填写补充说明。</p>" }
    ]
  },
  "matrix": {
    "cornerLabel": "维度 \\ 对象",
    "rows": [
      { "id": "dimension_1", "label": "维度一", "hidden": false },
      { "id": "dimension_2", "label": "维度二", "hidden": false },
      { "id": "dimension_3", "label": "维度三", "hidden": false },
      { "id": "dimension_4", "label": "维度四", "hidden": false }
    ],
    "columns": [
      { "id": "item_a", "label": "对象 A", "hidden": false },
      { "id": "item_b", "label": "对象 B", "hidden": false },
      { "id": "item_c", "label": "对象 C", "hidden": false }
    ],
    "cells": {
      "dimension_1::item_a": { "summary": "内容 A1", "detailHtml": "<p>这里填写对象 A 在维度一的说明。</p>" },
      "dimension_1::item_b": { "summary": "内容 B1", "detailHtml": "<p>这里填写对象 B 在维度一的说明。</p>" },
      "dimension_1::item_c": { "summary": "内容 C1", "detailHtml": "<p>这里填写对象 C 在维度一的说明。</p>" },
      "dimension_2::item_a": { "summary": "内容 A2", "detailHtml": "<p>这里填写对象 A 在维度二的说明。</p>" },
      "dimension_2::item_b": { "summary": "内容 B2", "detailHtml": "<p>这里填写对象 B 在维度二的说明。</p>" },
      "dimension_2::item_c": { "summary": "内容 C2", "detailHtml": "<p>这里填写对象 C 在维度二的说明。</p>" },
      "dimension_3::item_a": { "summary": "内容 A3", "detailHtml": "<p>这里填写对象 A 在维度三的说明。</p>" },
      "dimension_3::item_b": { "summary": "内容 B3", "detailHtml": "<p>这里填写对象 B 在维度三的说明。</p>" },
      "dimension_3::item_c": { "summary": "内容 C3", "detailHtml": "<p>这里填写对象 C 在维度三的说明。</p>" },
      "dimension_4::item_a": { "summary": "内容 A4", "detailHtml": "<p>这里填写对象 A 在维度四的说明。</p>" },
      "dimension_4::item_b": { "summary": "内容 B4", "detailHtml": "<p>这里填写对象 B 在维度四的说明。</p>" },
      "dimension_4::item_c": { "summary": "内容 C4", "detailHtml": "<p>这里填写对象 C 在维度四的说明。</p>" }
    }
  },
  "ending": {
    "eyebrow": "结束标签",
    "title": "结束标题",
    "bodyHtml": "<p>这里填写结束页说明。</p>"
  }
}
  </script>
  <script src="assets/sheetjs.full.min.js"></script>
  <script src="assets/mindmap-core.js?v=20260523b"></script>
  <script src="assets/matrix-core.js?v=20260523b"></script>
  <script src="assets/deck-stage-fit.js"></script>
</body>
</html>
